<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Some Game</title>
        <link rel="stylesheet" href="assets/style.css" />
        <script
            src="src/index.js"
            type="module"
            mime="text/javascript"
        ></script>
    </head>
    <body>
        <dialog id="modal">
            <p><strong class="modal-head"></strong></p>
            <p class="modal-body">...</p>
            <p class="modal-footer">
                <button class="modal-btn0 d-none">Close</button>
                <button class="modal-btn1 d-none">Ok</button>
            </p>
        </dialog>
        <div class="game-canvas-container">
            <div class="game-area">
                <canvas class="game-canvas"></canvas>
                <div class="canvas-overlay">
                    <div class="fps-indicator">
                        fps : <span class="fps-value">0</span>
                    </div>
                </div>
                <div class="game-paddle-container">
                    <div class="paddle paddle-jump"></div>
                    <div class="paddle paddle-move"></div>
                </div>
            </div>
        </div>
    </body>
</html>
